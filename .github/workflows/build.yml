name: Build and structural validation
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config gdb             qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools             libpam0g-dev libsystemd-dev \
            weston xvfb qt6-wayland qml6-module-qtqml \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models \
            qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window
      - name: Source invariants
        run: python3 tests/test-source-layout.py
      - name: Configure Meson
        run: meson setup build --prefix=/usr --libdir=lib
      - name: Compile
        run: meson compile -C build
      - name: Wallpaper SIMD/scalar equivalence
        run: meson test -C build --print-errorlogs
      - name: Reject non-root authentication and daemon entrypoints
        run: |
          ! ./build/plmd
          ! ./build/plm-session --mode user --user nobody --vt 2
      - name: Verify systemd service syntax
        run: |
          systemd-analyze verify data/plmd.service 2>&1 | tee /tmp/plmd-unit-check.txt
          ! grep -E 'Unknown key|Missing.*ExecStart|Failed to parse' /tmp/plmd-unit-check.txt
      - name: Headless Wayland greeter startup test
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Weston headless exposes no wl_seat. Ubuntu QtWayland 6.4
          # dereferences its absent input device while creating TextField.
          # Xvfb gives nested Weston a synthetic keyboard/mouse seat; the
          # greeter still runs strictly as a Wayland client.
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/plm-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "${weston_pid:-}" "$xvfb_pid" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for i in $(seq 1 50); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.1
          done
          [ -S /tmp/.X11-unix/X99 ] || { cat /tmp/plm-xvfb.log; exit 1; }
          # Pixman avoids slow/unsupported CI virtual-GL initialization.
          # The greeter itself still uses the Wayland Qt platform plugin.
          weston --backend=x11-backend.so --renderer=pixman --width=1600 --height=900 --socket=plm-ci \
            --idle-time=0 --log=/tmp/plm-weston.log &
          weston_pid=$!
          for i in $(seq 1 200); do
            [ -S "$XDG_RUNTIME_DIR/plm-ci" ] && break
            sleep 0.1
          done
          [ -S "$XDG_RUNTIME_DIR/plm-ci" ] || { cat /tmp/plm-weston.log; exit 1; }
          # A mock socket provides display-only sample accounts. This
          # process cannot authenticate anyone and is CI-only.
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /run/plm
          python3 tests/preview-backend.py >/tmp/plm-preview-backend.log 2>&1 &
          backend_pid=$!
          for i in $(seq 1 30); do
            [ -S /run/plm/control.sock ] && break
            sleep 0.1
          done
          [ -S /run/plm/control.sock ] || { cat /tmp/plm-preview-backend.log; exit 1; }
          rc=0
          # Exercise the production embedded qrc:/plm/Main.qml path,
          # not the PLM_QML_PATH development override.
          QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
          WAYLAND_DISPLAY=plm-ci PLM_PREVIEW_SCREENSHOT="$PWD/greeter-preview.png" \
          timeout --signal=TERM 6s ./build/plm-greeter >/tmp/plm-greeter.log 2>&1 || rc=$?
          cat /tmp/plm-greeter.log
          # Require a composited frame rather than just a living event loop.
          grep -q 'PLM_FIRST_FRAME_MS=' /tmp/plm-greeter.log || {
            echo "Greeter never submitted a first frame"; exit 1;
          }
          if [ "$rc" -ne 124 ]; then
            echo "Greeter terminated early: collecting C++ backtrace"
            QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
            WAYLAND_DISPLAY=plm-ci \
            timeout --signal=INT 15s gdb --batch -ex "set pagination off" \
              -ex "run" -ex "thread apply all bt 12" --args ./build/plm-greeter || true
          fi
          # timeout=124 means the greeter stayed alive under a real
          # Wayland compositor without a PAM backend. Early exit is failure.
          [ "$rc" -eq 124 ]
          test -s greeter-preview.png
          file greeter-preview.png
      - name: Upload real rendered greeter screenshot
        uses: actions/upload-artifact@v4
        with:
          name: actual-plasma-greeter
          path: greeter-preview.png
          if-no-files-found: error
          retention-days: 14
